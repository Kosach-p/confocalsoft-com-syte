<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Планы разработки | LMX2820 Controller</title>
    <style>
        /* Глобальные стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0e17;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1.5rem;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 150, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100, 0, 255, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .chip-badge {
            display: inline-block;
            background: rgba(0, 180, 255, 0.12);
            border: 1px solid rgba(0, 180, 255, 0.2);
            color: #5bbdff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 1.2rem;
            backdrop-filter: blur(4px);
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f9ff 0%, #8fcbff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.6rem;
        }

        .header p {
            color: #94a9c9;
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Панель версии */
        .version-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 30, 48, 0.7);
            border: 1px solid rgba(60, 90, 130, 0.3);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            margin-bottom: 2.8rem;
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .version-bar span {
            color: #b0c8e5;
        }

        .version-bar .v-number {
            color: #6db8ff;
            font-weight: 600;
        }

        .version-bar .v-status {
            color: #7fcb7f;
        }

        .fsi-thanks {
            color: #889fc0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fsi-thanks i {
            font-style: normal;
            background: rgba(255, 215, 0, 0.15);
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #ffd966;
        }

        /* Индикатор загрузки */
        .loading {
            text-align: center;
            color: #94a9c9;
            padding: 2rem;
            grid-column: 1/-1;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Сетка карточек */
        .updates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        .update-card {
            background: rgba(16, 26, 42, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(60, 100, 150, 0.25);
            border-radius: 24px;
            padding: 1.8rem 1.6rem;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .update-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 160, 255, 0.5);
            box-shadow: 0 16px 40px rgba(0, 100, 255, 0.15);
            background: rgba(20, 36, 58, 0.8);
        }

        .card-icon {
            font-size: 2.6rem;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: #e2ecfa;
        }

        .card-desc {
            color: #a0b8d9;
            line-height: 1.6;
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .card-id {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #5a7a9a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Благодарности ФСИ (нижний колонтитул) */
        .fsi-footer {
            margin-top: 4rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(60, 90, 130, 0.3);
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .fsi-footer span {
            background: rgba(0, 200, 255, 0.06);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #7a9bc7;
            border: 1px solid rgba(0, 200, 255, 0.08);
        }

        .fsi-footer span strong {
            color: #b8d6ff;
            font-weight: 500;
        }

        /* Ошибка */
        .error {
            color: #ff7a7a;
            text-align: center;
            padding: 2rem;
            grid-column: 1/-1;
        }

        /* Адаптив */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 2rem;
            }
            .version-bar {
                flex-direction: column;
                align-items: flex-start;
                border-radius: 28px;
                padding: 1rem 1.5rem;
            }
            .updates-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <div class="chip-badge">🔵 LMX2820 • SPI Controller</div>
            <h1>🚀 Планы разработки</h1>
            <p>Функции, которые появятся в ближайших версиях приложения</p>
        </header>

        <!-- Панель версии -->
        <div class="version-bar" id="versionBar">
            <span>📦 Загрузка...</span>
            <span class="fsi-thanks">
                <i>⚡</i> Благодарности ФСИ за поддержку
            </span>
            <span>📋 Статус: <span id="statusText">Загрузка...</span></span>
        </div>

        <!-- Сетка карточек -->
        <div class="updates-grid" id="updatesContainer">
            <div class="loading">Загрузка планов</div>
        </div>

        <!-- Благодарности ФСИ (нижний колонтитул) -->
        <div class="fsi-footer">
            <span><strong>🙏 ФСИ</strong> — Содействие в развитии</span>
            <span><strong>🧪</strong> Лаборатория частотного синтеза</span>
            <span><strong>📡</strong> Проект LMX2820</span>
        </div>
    </div>

    <script>
        // Загрузка данных из API
        async function loadFeatures() {
            const container = document.getElementById('updatesContainer');
            const versionBar = document.getElementById('versionBar');
            const statusText = document.getElementById('statusText');

            try {
                const response = await fetch('/api/features');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                // Обновляем версионную панель
                versionBar.innerHTML = `
                    <span>📦 Текущая версия: <span class="v-number">${data.current_version}</span></span>
                    <span class="fsi-thanks">
                        <i>⚡</i> Благодарности ФСИ за поддержку
                    </span>
                    <span>📋 Статус: <span class="v-status">${data.status}</span></span>
                `;

                // Рендерим карточки
                if (!data.features || data.features.length === 0) {
                    container.innerHTML = `<p style="color: #94a9c9; text-align: center; grid-column: 1/-1;">Пока обновлений нет. Следите за новостями!</p>`;
                    return;
                }

                let html = '';
                data.features.forEach(f => {
                    html += `
                        <div class="update-card">
                            <div class="card-icon">${f.icon}</div>
                            <div class="card-title">${f.title}</div>
                            <div class="card-desc">${f.description}</div>
                            <div class="card-id">ID: ${f.id}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = `
                    <div class="error">
                        ⚠️ Не удалось загрузить данные<br>
                        <small style="color: #6a8aaa;">${error.message}</small>
                    </div>
                `;
            }
        }

        // Загружаем при старте
        loadFeatures();

        // Обновляем каждые 30 секунд (на случай, если данные поменялись на бэкенде)
        setInterval(loadFeatures, 30000);
    </script>
</body>
</html>
